# CBS experiment: Qwen3 0.19B — AdamW + Constant LR + EWA
# Sweeps over global_batch_size; stops at target validation loss.
# Use with: SWEEP_CONFIG=sweeps/cbs_sweeps/qwen3_0.19b_adamw.yaml

# Override defaults
model: qwen3_0.19b
training: qwen3_0.19b
optimizer: hyperball_muon
data: olmo60b_neox
distributed: single_gpu

# Constant LR (total steps unknown a priori)
optimizer.lr: [1.0e-2, 3.16e-3, 1.0e-3]
optimizer.min_lr: 0.0
optimizer.lr_warmup_iters: [1000]
optimizer.lr_decay_style: cosine
optimizer.lr_decay_iters: 29068
optimizer.weight_decay: [0.0]
optimizer.muon_hyperball_momentum: 0.95
optimizer.muon_hyperball_scale_mode: spectral_mup
optimizer.muon_hyperball_msign_steps: 8
optimizer.muon_hyperball_radius_mode: initialize

model.untie_embeddings_and_output_weights: true
model.spectral_mup_init: true
# model.lecun_init: true
model.init_method_std: 0.02

# optimizer.output_layer_lr_scale: 0.0013  # ~1/768
# optimizer.output_layer_wd_scale: 0.0013

# Sweep over batch sizes (powers of 2)
training.global_batch_size: [128]
training.micro_batch_size: 32
training.eval_global_batch_size: 256

# Safety cap
training.train_iters: 29068
training.eval_interval: 2000
training.save_interval: 500

# W&B settings
wandb.enabled: true
wandb.project: megatron-cbs-1
wandb.name: cbs_adamw_0.19B_slurm${oc.env:SLURM_JOB_ID,local}

# Checkpointing
training.no_save_optim: false

# Paths
paths.output_dir: /n/netscratch/kempner_barak_lab/Lab/nabreu/results/cbs/qwen3_0.19B_adamw
