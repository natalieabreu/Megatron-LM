# CBS experiment: Qwen3 0.19B — Scion + Constant LR + EWA
# Sweeps over global_batch_size; stops at target validation loss.
# Use with: SWEEP_CONFIG=sweeps/cbs_sweeps/qwen3_0.19b_scion_a100.yaml

# Override defaults
model: qwen3_0.19b
training: qwen3_0.19b
optimizer: scion
data: olmo60b_neox
distributed: single_gpu

# Constant LR (total steps unknown a priori)
optimizer.lr: [1.0e-2, 3.16e-2]
optimizer.min_lr: 0.0
optimizer.lr_warmup_iters: [1000]
optimizer.lr_decay_style: cosine
optimizer.lr_decay_iters: 1817
optimizer.weight_decay: [0.0, 0.1]
optimizer.use_distributed_optimizer: false

# Scion specific parameters
optimizer.scion_momentum: [0.95, 0.9]
optimizer.scion_fp32_matmul_prec: medium
optimizer.scion_coefficient_type: quintic
optimizer.scion_num_ns_steps: 5
optimizer.scion_scale_mode: spectral_mup
optimizer.scion_spectral_radius: 1.0

# Adam fallback parameters (bias, norms, embeddings, output layer)
optimizer.adam_beta1: 0.9
optimizer.adam_beta2: 0.9
optimizer.adam_eps: 1.0e-8

model.untie_embeddings_and_output_weights: true
model.init_method_std: 0.02

# Sweep over batch sizes (powers of 2)
training.global_batch_size: [2048]
training.micro_batch_size: 16
training.eval_global_batch_size: 256

# Safety cap
training.train_iters: 1817
training.eval_interval: 500
training.save_interval: 500

# W&B settings
wandb.enabled: true
wandb.project: megatron-cbs-1
wandb.name: cbs_scion_0.19B_a100_slurm${oc.env:SLURM_JOB_ID,local}

# Checkpointing
training.no_save_optim: false

# Paths
paths.output_dir: /n/netscratch/kempner_barak_lab/Lab/nabreu/results/cbs/qwen3_0.19B_scion_a100
