# CBS experiment: Qwen3 0.19B — Spectral Sphere + Constant LR + EWA
  # Sweeps over global_batch_size; stops at target validation loss.
  # Use with: SWEEP_CONFIG=sweeps/cbs_sweeps/qwen3_0.19b_spectral_ball_a100.yaml

  model: qwen3_0.19b
  training: qwen3_0.19b
  optimizer: spectral_ball_dist
  data: olmo60b_neox
  distributed: single_gpu

  # optimizer.lr: [1.0e-2, 3.16e-3, 1.0e-3]
  optimizer.lr: [1.0e-2, 3.16e-2]
  optimizer.min_lr: 0.0
  optimizer.lr_warmup_iters: [1000]
  optimizer.lr_decay_style: cosine
  optimizer.lr_decay_iters: 3633
  optimizer.weight_decay: [0.1]
  optimizer.spectral_ball_momentum: [0.9, 0.95]

  optimizer.adam_beta1: 0.9
  optimizer.adam_beta2: [0.95]
  optimizer.adam_eps: 1.0e-8

  optimizer.output_layer_lr_scale: 0.1

  model.untie_embeddings_and_output_weights: true
  model.init_method_std: 0.02

  training.global_batch_size: [1024]
  training.micro_batch_size: 64
  training.eval_global_batch_size: 256
  
  training.train_iters: 3633
  training.eval_interval: 500
  training.save_interval: 500

  wandb.enabled: true
  wandb.project: megatron-cbs-1
  wandb.name: cbs_spectral_ball_0.19B_h200_slurm${oc.env:SLURM_JOB_ID,local}

  training.no_save_optim: false

  paths.output_dir: /n/netscratch/kempner_barak_lab/Lab/nabreu/results/cbs/qwen3_0.19B_spectral_ball_a100
