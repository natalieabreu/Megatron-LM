# Qwen3 ~0.3B Model Configuration
# Approx params: ~0.32-0.36B depending on exact implementation details.
# 24 layers, hidden=768, ffn=2304, 12 heads, GQA 6 groups.
num_layers: 24
hidden_size: 768
ffn_hidden_size: 2304
num_attention_heads: 12
kv_channels: 64
seq_length: 4096
max_position_embeddings: 40960
vocab_size: 100352

# Group Query Attention (GQA)
group_query_attention: true
num_query_groups: 6

# Normalization
normalization: RMSNorm
norm_epsilon: 1.0e-6

# Dropout (disabled for training stability)
attention_dropout: 0
hidden_dropout: 0

# Precision
precision: bf16

# Position embeddings
use_rotary_position_embeddings: true
rotary_base: 1000000

# Architecture
swiglu: true
untie_embeddings_and_output_weights: true
disable_bias_linear: true
qk_layernorm: true

# Initialization
init_method_std: 0.02
split_qkv_init_mode: head
spectral_mup_init: true
use_cpu_initialization: true

# Transformer implementation
transformer_impl: transformer_engine
attention_backend: fused

# Cross entropy optimization
cross_entropy_loss_fusion: true
