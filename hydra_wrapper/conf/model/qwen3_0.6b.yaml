# Qwen3 ~0.6B Model Configuration
# Architecture: 28 layers, hidden=1024, ffn=3072, 16 heads, GQA 8 groups
# Param count: ~0.65B (28 × [QKV + O + FFN + norms] + 2×vocab×1024)
num_layers: 28
hidden_size: 1024
ffn_hidden_size: 3072
num_attention_heads: 16
kv_channels: 128
seq_length: 4096
max_position_embeddings: 40960
vocab_size: 100352

# Group Query Attention (GQA)
group_query_attention: true
num_query_groups: 8

# Normalization
normalization: RMSNorm
norm_epsilon: 1.0e-6

# Dropout (disabled for training stability)
attention_dropout: 0
hidden_dropout: 0

# Precision
precision: bf16

# Position embeddings
use_rotary_position_embeddings: true
rotary_base: 1000000

# Architecture
swiglu: true
untie_embeddings_and_output_weights: true
disable_bias_linear: true
qk_layernorm: true

# Initialization — LeCun init: std = 1/sqrt(d_in) for 2D weights
lecun_init: true

# Transformer implementation
transformer_impl: transformer_engine
attention_backend: fused

# Cross entropy optimization
cross_entropy_loss_fusion: true
