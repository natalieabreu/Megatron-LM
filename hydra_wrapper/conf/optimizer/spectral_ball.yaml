# Spectral Ball optimizer configuration

name: spectral_ball
lr: 0.001
min_lr: 0.0001
decoupled_lr: null
decoupled_min_lr: null
output_layer_lr_scale: null
output_layer_wd_scale: null
lr_warmup_iters: 500
lr_decay_iters: null
lr_decay_style: cosine
weight_decay: 0.0  # Spectral ball constrains weights, minimal/no WD needed

# Adam fallback parameters (for scalar / non-2D params: bias, norms, embeddings)
adam_beta1: 0.9
adam_beta2: 0.999
adam_eps: 1.0e-8

# Spectral Ball specific parameters
spectral_ball_momentum: 0.9
spectral_ball_use_nesterov: true
spectral_ball_msign_steps: 8
spectral_ball_power_iteration_steps: 20
spectral_ball_radius_mode: spectral_mup
spectral_ball_scale_mode: spectral_mup
spectral_ball_solver: bisection
spectral_ball_solver_max_iterations: 20
spectral_ball_solver_tolerance_f: 1.0e-8
spectral_ball_retract_mode: hard
spectral_ball_retract_alpha: 0.05

# Split modes for fused layers
spectral_ball_split_qkv: true
spectral_ball_qkv_split_mode: component  # Options: group, component, head
spectral_ball_split_fc1: false
spectral_ball_split_moe_experts: true
